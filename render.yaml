services:
  - type: web
    name: ngo-cms-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt && python manage.py migrate --noinput && python manage.py collectstatic --noinput"
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: "ngo-cms-backend.onrender.com"
      - key: DB_NAME
        fromDatabase:
          name: ngo-cms-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: ngo-cms-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: ngo-cms-db
          property: password
      - key: DB_HOST
        fromDatabase:
          name: ngo-cms-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: ngo-cms-db
          property: port
      - key: CORS_ALLOWED_ORIGINS
        value: "https://your-frontend.vercel.app"
      - key: CLOUDINARY_URL
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: DJANGO_SETTINGS_MODULE
        value: "config.settings.production"
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: FRONTEND_URL
        value: "https://your-frontend.vercel.app"

databases:
  - name: ngo-cms-db
    plan: free
    databaseName: ngo_cms
    user: ngo_cms_user